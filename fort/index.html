<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Fort adatlap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #00afed;
    --blue-dark: #00779e;
    --navy: #002533;
    --ink: #2b3138;
    --muted: #6b7480;
    --line: #dde3e8;
    --bg: #f2f5f7;
    --card: #ffffff;
    --ok: #1f9d55;
    --warn: #d9822b;
    --rec: #d6364a;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: 'Barlow', system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 17px; line-height: 1.5; }
  header.top { background: var(--navy); }
  header.top .in { max-width: 820px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 18px; }
  header.top img { height: 58px; width: auto; display: block; }
  header.top .t { color: #fff; font-weight: 600; font-size: 1.05rem; line-height: 1.25; }
  header.top .t small { display: block; font-weight: 400; color: #9fc4d4; font-size: .82rem; }
  main { max-width: 820px; margin: 0 auto; padding: 22px 16px 120px; }
  .intro { background: var(--card); border-left: 5px solid var(--blue); border-radius: 8px; padding: 18px 20px; margin-bottom: 22px; }
  .intro h1 { font-size: 1.45rem; margin: 0 0 8px; color: var(--navy); }
  .intro p { margin: 0 0 10px; }
  .intro p:last-child { margin-bottom: 0; }
  .statusbar { position: sticky; top: 0; z-index: 20; background: rgba(242,245,247,.95); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); margin: 0 -16px 18px; padding: 8px 16px; display: flex; align-items: center; gap: 14px; font-size: .9rem; }
  .bar { flex: 1; height: 8px; background: #dbe3e8; border-radius: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .3s; }
  .save { white-space: nowrap; color: var(--muted); }
  .save.ok { color: var(--ok); }
  .save.busy { color: var(--warn); }
  .save.err { color: var(--rec); font-weight: 600; }
  section.sec { margin-bottom: 30px; }
  section.sec > h2 { font-size: 1.25rem; color: var(--navy); margin: 0 0 4px; padding-bottom: 6px; border-bottom: 2px solid var(--blue); display: flex; gap: 10px; align-items: baseline; }
  section.sec > h2 .n { color: var(--blue); }
  .lead { color: var(--muted); margin: 8px 0 14px; font-size: .96rem; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 16px 14px; margin-bottom: 12px; }
  .q.done { border-color: #bfe6cf; }
  .q h3 { font-size: 1.04rem; font-weight: 600; margin: 0 0 4px; }
  .q .help { color: var(--muted); font-size: .9rem; margin: 0 0 10px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
  .pill { border: 1.5px solid #c3ccd3; background: #fff; color: var(--ink); padding: 9px 15px; border-radius: 22px; font: inherit; font-size: .95rem; cursor: pointer; min-height: 42px; }
  .pill:hover { border-color: var(--blue); }
  .pill.on { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .pill.unk.on { background: #7b8691; border-color: #7b8691; }
  .tw { position: relative; }
  textarea, input.short { width: 100%; font: inherit; font-size: 1rem; padding: 11px 12px; border: 1.5px solid #c3ccd3; border-radius: 8px; background: #fff; color: var(--ink); }
  textarea { min-height: 84px; resize: vertical; padding-right: 58px; line-height: 1.45; }
  textarea:focus, input.short:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,175,237,.18); }
  .mic { position: absolute; right: 8px; top: 8px; width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid #c3ccd3; background: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .mic svg { width: 22px; height: 22px; fill: var(--blue-dark); }
  .mic:hover { border-color: var(--blue); }
  .mic.rec { background: var(--rec); border-color: var(--rec); animation: pulse 1.2s infinite; }
  .mic.rec svg { fill: #fff; }
  .mic.busy { opacity: .6; cursor: wait; }
  .mic.off { opacity: .35; cursor: not-allowed; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(214,54,74,.5) } 70% { box-shadow: 0 0 0 12px rgba(214,54,74,0) } 100% { box-shadow: 0 0 0 0 rgba(214,54,74,0) } }
  .micmsg { font-size: .85rem; margin-top: 4px; min-height: 1.1em; color: var(--muted); }
  .micmsg.rec { color: var(--rec); font-weight: 600; }
  .micmsg.err { color: var(--rec); }
  .files { margin-top: 10px; }
  .drop { border: 2px dashed #b5c2cb; border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); font-size: .93rem; background: #fafcfd; }
  .drop.over { border-color: var(--blue); background: #eaf8fe; }
  .btnfile { display: inline-block; margin-top: 6px; background: #fff; border: 1.5px solid var(--blue); color: var(--blue-dark); padding: 9px 16px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; min-height: 42px; }
  .btnfile:hover { background: #eaf8fe; }
  ul.fl { list-style: none; margin: 10px 0 0; padding: 0; }
  ul.fl li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: #fff; font-size: .92rem; }
  ul.fl .nm { flex: 1; word-break: break-all; }
  ul.fl .sz { color: var(--muted); white-space: nowrap; }
  ul.fl .del { border: none; background: none; color: var(--rec); font-size: 1.3rem; cursor: pointer; padding: 0 6px; }
  ul.fl .prog { flex: 0 0 90px; height: 6px; background: #dbe3e8; border-radius: 4px; overflow: hidden; }
  ul.fl .prog i { display: block; height: 100%; background: var(--blue); width: 0; }
  ul.fl li.err { border-color: var(--rec); color: var(--rec); }
  .finish { background: var(--navy); color: #fff; border-radius: 12px; padding: 22px; text-align: center; margin-top: 10px; }
  .finish p { margin: 0 0 14px; color: #cfe3ec; }
  .btnmain { background: var(--blue); color: #fff; border: none; border-radius: 10px; padding: 15px 34px; font: inherit; font-size: 1.1rem; font-weight: 700; cursor: pointer; min-height: 52px; }
  .btnmain:hover { background: #0099cf; }
  .btnmain:disabled { opacity: .6; cursor: wait; }
  .thanks { display: none; background: #e7f6ed; border: 1px solid #b6e1c6; color: #145c33; border-radius: 12px; padding: 18px 20px; margin-top: 16px; text-align: center; font-weight: 500; }
  .fatal { max-width: 560px; margin: 70px auto; padding: 0 20px; text-align: center; color: var(--ink); }
  .fatal h1 { color: var(--navy); }
  @media (max-width: 560px) {
    header.top img { height: 46px; }
    header.top .t { font-size: .95rem; }
    body { font-size: 16px; }
    .pill { flex: 1 1 auto; text-align: center; }
  }
</style>
</head>
<body>
<header class="top"><div class="in">
  <img src="fort-logo.svg" alt="Fort Facility">
  <div class="t">Adatlap a pályázatfigyelőhöz<small id="who"></small></div>
</div></header>
<main id="app"><p style="text-align:center;color:#6b7480;margin-top:60px">Betöltés…</p></main>

<script>
(function () {
  'use strict';
  // A háttér-API címe. Helyi teszthez a localhost-ot használja.
  var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? location.origin : 'https://fort-adatlap.vercel.app';
  var TOKEN = new URLSearchParams(location.search).get('t') || '';
  var app = document.getElementById('app');
  var state = { schema: null, data: {}, files: [], submittedAt: null, pending: {}, saveTimer: null, saving: 0, uploads: 0, dirty: false };
  var statusEl, barEl, countEl;

  function el(tag, props, kids) {
    var e = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === 'class') e.className = props[k];
      else if (k === 'text') e.textContent = props[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), props[k]);
      else if (props[k] !== false && props[k] != null) e.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function fatal(title, msg) {
    app.innerHTML = '';
    app.appendChild(el('div', { class: 'fatal' }, [el('h1', { text: title }), el('p', { text: msg })]));
  }
  function api(path, opts) {
    opts = opts || {};
    var init = { method: opts.body ? 'POST' : 'GET', headers: {} };
    if (opts.body) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(Object.assign({ t: TOKEN }, opts.body)); }
    return fetch(API + '/api/fort/' + path + (opts.body ? '' : (path.indexOf('?') < 0 ? '?t=' + encodeURIComponent(TOKEN) : '')), init)
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'Hibás válasz.' }; }); });
  }

  // ── mentési állapot ──
  function setStatus(kind, text) { if (!statusEl) return; statusEl.className = 'save ' + kind; statusEl.textContent = text; }
  function scheduleSave() {
    state.dirty = true;
    setStatus('busy', 'Mentés…');
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(flushSave, 900);
    updateProgress();
  }
  function flushSave() {
    clearTimeout(state.saveTimer);
    var batch = state.pending; state.pending = {};
    var keys = Object.keys(batch);
    if (!keys.length) { if (!state.saving) setStatus('ok', 'Mentve ✓'); return Promise.resolve(true); }
    state.saving++;
    return api('save', { body: { data: batch } }).then(function (r) {
      state.saving--;
      if (r.ok) { if (!Object.keys(state.pending).length && !state.saving) { setStatus('ok', 'Mentve ✓'); state.dirty = false; } return true; }
      keys.forEach(function (k) { if (!(k in state.pending)) state.pending[k] = batch[k]; });
      setStatus('err', r.error || 'Nem sikerült menteni — újrapróbálom…');
      state.saveTimer = setTimeout(flushSave, 4000);
      return false;
    }).catch(function () {
      state.saving--;
      keys.forEach(function (k) { if (!(k in state.pending)) state.pending[k] = batch[k]; });
      setStatus('err', 'Nincs kapcsolat — újrapróbálom…');
      state.saveTimer = setTimeout(flushSave, 4000);
      return false;
    });
  }
  function setVal(key, val) {
    if (val === '' || val == null) delete state.data[key]; else state.data[key] = val;
    state.pending[key] = val == null ? '' : val;
    scheduleSave();
  }
  window.addEventListener('beforeunload', function (e) {
    if (state.uploads > 0 || Object.keys(state.pending).length || state.saving) { e.preventDefault(); e.returnValue = ''; }
  });

  // ── haladás ──
  var allQ = [];
  function answered(q) {
    return !!(state.data[q.id + '_choice'] || state.data[q.id + '_text'] || state.files.some(function (f) { return f.field === q.id; }));
  }
  function updateProgress() {
    var n = allQ.filter(answered).length;
    if (barEl) barEl.style.width = Math.round(100 * n / Math.max(1, allQ.length)) + '%';
    if (countEl) countEl.textContent = n + ' / ' + allQ.length + ' kérdés';
    allQ.forEach(function (q) { var c = document.getElementById('q-' + q.id); if (c) c.classList.toggle('done', answered(q)); });
  }

  // ── diktálás (egyben megy, nem szeleteljük) ──
  var MIC_SVG = '<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
  var rec = null;
  var MAX_REC = 300;
  function micMsg(box, text, cls) { box.className = 'micmsg' + (cls ? ' ' + cls : ''); box.textContent = text || ''; }
  function toggleMic(btn, ta, box, key) {
    if (rec && rec.btn === btn) { stopRec(); return; }
    if (rec) return;
    if (!navigator.mediaDevices || !window.MediaRecorder) { micMsg(box, 'Ez a böngésző nem támogatja a diktálást — gépeld be.', 'err'); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
      var mime = ''; for (var i = 0; i < types.length; i++) { if (MediaRecorder.isTypeSupported(types[i])) { mime = types[i]; break; } }
      var recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      var chunks = [];
      rec = { btn: btn, ta: ta, box: box, key: key, recorder: recorder, stream: stream, started: Date.now(), timer: null, mime: recorder.mimeType || mime || 'audio/webm' };
      recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = function () {
        var r = rec; rec = null;
        clearInterval(r.timer);
        r.stream.getTracks().forEach(function (t) { t.stop(); });
        r.btn.classList.remove('rec');
        var secs = Math.round((Date.now() - r.started) / 1000);
        var blob = new Blob(chunks, { type: r.mime });
        transcribe(r, blob, secs);
      };
      recorder.start();
      btn.classList.add('rec');
      micMsg(box, 'Felvétel… 0:00 — nyomd meg újra a befejezéshez', 'rec');
      rec.timer = setInterval(function () {
        var s = Math.round((Date.now() - rec.started) / 1000);
        micMsg(box, 'Felvétel… ' + Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2) + ' — nyomd meg újra a befejezéshez', 'rec');
        if (s >= MAX_REC) stopRec();
      }, 500);
    }).catch(function () { micMsg(box, 'A mikrofon nem érhető el — engedélyezd a böngészőben, vagy gépeld be.', 'err'); });
  }
  function stopRec() { if (rec && rec.recorder.state !== 'inactive') rec.recorder.stop(); }
  function transcribe(r, blob, secs) {
    r.btn.classList.add('busy');
    micMsg(r.box, 'Átírás…');
    var fr = new FileReader();
    fr.onload = function () {
      var b64 = String(fr.result).split(',')[1] || '';
      api('transcribe', { body: { audio_base64: b64, mime_type: r.mime, duration_seconds: secs } }).then(function (res) {
        r.btn.classList.remove('busy');
        if (res.ok && res.text) {
          var cur = r.ta.value;
          r.ta.value = cur ? cur.replace(/\s+$/, '') + (cur.slice(-1) === '\n' ? '' : ' ') + res.text : res.text;
          autoGrow(r.ta);
          setVal(r.key, r.ta.value);
          micMsg(r.box, 'Kész — nézd át, és javítsd, ha kell.');
        } else {
          micMsg(r.box, res.error || 'Az átírás nem sikerült.', 'err');
          if (res.limit) disableMics();
        }
      }).catch(function () { r.btn.classList.remove('busy'); micMsg(r.box, 'Nincs kapcsolat — próbáld újra.', 'err'); });
    };
    fr.readAsDataURL(blob);
  }
  function disableMics() { document.querySelectorAll('.mic').forEach(function (b) { b.classList.add('off'); b.disabled = true; b.title = 'A diktálás most nem elérhető'; }); }
  function autoGrow(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(Math.max(ta.scrollHeight + 2, 84), 420) + 'px'; }

  // ── fájlok ──
  function human(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
  function renderFiles(ul, qid) {
    ul.innerHTML = '';
    state.files.filter(function (f) { return f.field === qid; }).forEach(function (f) {
      var li = el('li', null, [
        el('span', { class: 'nm', text: '📎 ' + f.name }),
        el('span', { class: 'sz', text: human(f.size || 0) }),
        el('button', { class: 'del', type: 'button', title: 'Törlés', text: '×', onclick: function () {
          if (!confirm('Törlöd ezt a fájlt?\n' + f.name)) return;
          api('file-delete', { body: { path: f.path } }).then(function (r) { if (r.ok) { state.files = r.files; refreshAllFiles(); updateProgress(); } else alert(r.error || 'Nem sikerült törölni.'); });
        } })
      ]);
      ul.appendChild(li);
    });
  }
  function refreshAllFiles() { document.querySelectorAll('ul.fl[data-q]').forEach(function (ul) { renderFiles(ul, ul.getAttribute('data-q')); }); }
  function uploadFile(file, qid, ul) {
    var li = el('li', null, [el('span', { class: 'nm', text: '⏳ ' + file.name }), el('span', { class: 'prog' }, [el('i')]), el('span', { class: 'sz', text: human(file.size) })]);
    ul.appendChild(li);
    var bar = li.querySelector('.prog i');
    function fail(msg) { state.uploads--; li.className = 'err'; li.innerHTML = ''; li.appendChild(el('span', { class: 'nm', text: '✗ ' + file.name + ' — ' + msg })); li.appendChild(el('button', { class: 'del', type: 'button', text: '×', onclick: function () { li.remove(); } })); }
    state.uploads++;
    api('upload-url', { body: { field: qid, name: file.name, size: file.size } }).then(function (r) {
      if (!r.ok) return fail(r.error || 'nem indítható');
      var fd = new FormData(); fd.append('cacheControl', '3600'); fd.append('', file);
      var xhr = new XMLHttpRequest();
      xhr.open('PUT', r.upload_url);
      xhr.upload.onprogress = function (e) { if (e.lengthComputable) bar.style.width = Math.round(100 * e.loaded / e.total) + '%'; };
      xhr.onerror = function () { fail('megszakadt a feltöltés'); };
      xhr.onload = function () {
        if (xhr.status < 200 || xhr.status >= 300) return fail('a feltöltés nem sikerült (' + xhr.status + ')');
        api('file-done', { body: { field: qid, path: r.path, name: file.name, size: file.size, mime: file.type } }).then(function (d) {
          state.uploads--;
          if (d.ok) { state.files = d.files; refreshAllFiles(); updateProgress(); } else { state.uploads++; fail(d.error || 'nem erősíthető meg'); }
        }).catch(function () { state.uploads++; fail('nincs kapcsolat'); });
      };
      xhr.send(fd);
    }).catch(function () { fail('nincs kapcsolat'); });
  }

  // ── űrlap felépítése ──
  function buildQuestion(q, num) {
    var card = el('div', { class: 'q', id: 'q-' + q.id });
    card.appendChild(el('h3', { text: q.q }));
    if (q.help) card.appendChild(el('p', { class: 'help', text: q.help }));
    if (q.choice) {
      var pills = el('div', { class: 'pills' });
      var cur = state.data[q.id + '_choice'];
      q.choice.forEach(function (c) {
        var b = el('button', { type: 'button', class: 'pill' + (c === 'Nem tudom' ? ' unk' : '') + (cur === c ? ' on' : ''), text: c, onclick: function () {
          var on = b.classList.contains('on');
          pills.querySelectorAll('.pill').forEach(function (x) { x.classList.remove('on'); });
          if (!on) b.classList.add('on');
          setVal(q.id + '_choice', on ? '' : c);
        } });
        pills.appendChild(b);
      });
      card.appendChild(pills);
    }
    if (q.text === 'long') {
      var key = q.id + '_text';
      var ta = el('textarea', { rows: 3, placeholder: q.hint || 'Ide írhatsz, vagy a mikrofonnal bediktálhatod…' });
      ta.value = state.data[key] || '';
      ta.addEventListener('input', function () { autoGrow(ta); setVal(key, ta.value); });
      var box = el('div', { class: 'micmsg' });
      var mic = el('button', { type: 'button', class: 'mic', title: 'Bediktálom', 'aria-label': 'Bediktálom', onclick: function () { toggleMic(mic, ta, box, key); } });
      mic.innerHTML = MIC_SVG;
      card.appendChild(el('div', { class: 'tw' }, [ta, mic]));
      card.appendChild(box);
      setTimeout(function () { autoGrow(ta); }, 0);
    } else if (q.text === 'short') {
      var k2 = q.id + '_text';
      var inp = el('input', { class: 'short', type: 'text', placeholder: q.hint || '' });
      inp.value = state.data[k2] || '';
      inp.addEventListener('input', function () { setVal(k2, inp.value); });
      card.appendChild(inp);
    }
    if (q.files) {
      var wrap = el('div', { class: 'files' });
      var ul = el('ul', { class: 'fl', 'data-q': q.id });
      var input = el('input', { type: 'file', multiple: 'multiple', style: 'display:none', accept: 'image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.rtf,.odt,.ods,.zip,.m4a,.mp3,.mp4,.mov' });
      input.addEventListener('change', function () { Array.prototype.forEach.call(input.files, function (f) { uploadFile(f, q.id, ul); }); input.value = ''; });
      var drop = el('div', { class: 'drop' }, [
        el('div', { text: 'Húzd ide a fájlt, vagy:' }),
        el('button', { type: 'button', class: 'btnfile', text: '📷 Fájl / fénykép hozzáadása', onclick: function () { input.click(); } })
      ]);
      ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
      drop.addEventListener('drop', function (e) { Array.prototype.forEach.call(e.dataTransfer.files, function (f) { uploadFile(f, q.id, ul); }); });
      wrap.appendChild(drop); wrap.appendChild(input); wrap.appendChild(ul);
      card.appendChild(wrap);
      renderFiles(ul, q.id);
    }
    return card;
  }

  function build(d) {
    var s = d.schema;
    document.title = 'Fort adatlap';
    document.getElementById('who').textContent = d.label ? d.label + ' részére' : '';
    app.innerHTML = '';
    allQ = [];
    var intro = el('div', { class: 'intro' }, [el('h1', { text: s.title })]);
    s.intro.forEach(function (p) { intro.appendChild(el('p', { text: p })); });
    app.appendChild(intro);

    statusEl = el('span', { class: 'save ok', text: 'Mentve ✓' });
    barEl = el('i'); countEl = el('span', { class: 'save' });
    app.appendChild(el('div', { class: 'statusbar' }, [el('div', { class: 'bar' }, [barEl]), countEl, statusEl]));

    s.sections.forEach(function (sec, si) {
      var node = el('section', { class: 'sec' });
      node.appendChild(el('h2', null, [el('span', { class: 'n', text: String.fromCharCode(65 + si) + '.' }), sec.title]));
      if (sec.lead) node.appendChild(el('p', { class: 'lead', text: sec.lead }));
      sec.questions.forEach(function (q) { allQ.push(q); node.appendChild(buildQuestion(q)); });
      app.appendChild(node);
    });

    var thanks = el('div', { class: 'thanks', text: 'Köszönjük, megkaptuk! 🙏 Ha eszedbe jut még valami, bármikor visszajöhetsz ugyanezzel a linkkel, és a végén újra megnyomhatod a gombot.' });
    var btn = el('button', { type: 'button', class: 'btnmain', text: d.submitted_at ? 'Újra elküldöm a kiegészítéssel' : 'Kész, elküldöm' });
    btn.addEventListener('click', function () {
      if (state.uploads > 0) { alert('Még fut egy fájlfeltöltés — várd meg, hogy befejeződjön.'); return; }
      btn.disabled = true; btn.textContent = 'Küldés…';
      flushSave().then(function (ok) {
        if (!ok) { btn.disabled = false; btn.textContent = 'Kész, elküldöm'; alert('Nem sikerült menteni — ellenőrizd a kapcsolatot, és próbáld újra.'); return; }
        api('submit', { body: {} }).then(function (r) {
          btn.disabled = false;
          if (r.ok) { btn.textContent = 'Újra elküldöm a kiegészítéssel'; thanks.style.display = 'block'; thanks.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
          else { btn.textContent = 'Kész, elküldöm'; alert(r.error || 'Nem sikerült elküldeni.'); }
        }).catch(function () { btn.disabled = false; btn.textContent = 'Kész, elküldöm'; alert('Nincs kapcsolat — próbáld újra.'); });
      });
    });
    app.appendChild(el('div', { class: 'finish' }, [el('p', { text: 'Nem kell mindenre válaszolni. Ami kimaradt, azt később is pótolhatod.' }), btn]));
    app.appendChild(thanks);
    updateProgress();
  }

  if (!/^[A-Za-z0-9]{20,64}$/.test(TOKEN)) {
    fatal('Hiányzó vagy hibás link', 'Ez az oldal csak a személyes linkeddel nyílik meg. Kérd el újra attól, aki küldte.');
    return;
  }
  api('schema').then(function (d) {
    if (!d.ok) return fatal('Nem érhető el', d.error || 'Ez a link nem érvényes.');
    state.schema = d.schema; state.data = d.data || {}; state.files = d.files || []; state.submittedAt = d.submitted_at;
    build(d);
    if (d.dictation === false) disableMics();
  }).catch(function () { fatal('Nincs kapcsolat', 'Nem sikerült betölteni az adatlapot. Ellenőrizd a kapcsolatot, és frissítsd az oldalt.'); });
})();
</script>
</body>
</html>
